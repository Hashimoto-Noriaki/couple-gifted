openapi: 3.0.3
info:
  title: CoupleGifted API
  version: "0.1.0"
  description: |
    交際中から結婚後までのふたり向けライフプラットフォームのAPI。
    詳細な設計判断・用語は doc/api-design.md を参照。
    このファイルがエンドポイントの実スキーマの正本（SSoT）。

    ## バージョンを3.0.3にしている理由
    バックエンドの契約検証に使う committee gem（5.6.3時点）が OpenAPI 3.1 系に
    未対応（`Committee::OpenAPI3Unsupported`）のため、3.0.3を使う。
    committeeが3.1に対応したら見直す。

    ## 未整備（実装が進むにつれて拡充する）
    現時点では doc/requirements.md のスケジュール（Week 3-4 縦串貫通、issue #49）に沿って、
    スポット検索・詳細と、その絞り込みに使うマスタ（エリア・カテゴリ一覧）、
    新規登録（issue #46）、ログイン・トークン更新・ログアウト（issue #107）のみを定義している。
    他の窓口は doc/api-design.md の「エンドポイント一覧」を見ながら機能ごとに追記する。

    ## idの型について
    doc/er-and-db-design.md の通り主キーはuuidのため、id・area_id・category_id は
    string（format: uuid）。SQLiteにネイティブなuuid型は無く、アプリ側（ApplicationRecord）
    で生成する。

    ## 認証
    会員限定の窓口は `Authorization: Bearer <access_token>` で呼ぶ（securitySchemes「bearerAuth」）。
    アクセストークン（15分）が切れたら /auth/refresh にリフレッシュトークン（30日）を渡し、2本とも
    新しくもらう。方式は doc/requirements.md 決定事項ログ #30、doc/api-design.md「設計上の判断 7」。

servers:
  - url: /api/v1

paths:
  /spots:
    get:
      operationId: listSpots
      summary: スポットを検索する
      description: |
        条件に合うスポットの一覧を返す（カーソルページネーション）。
        doc/api-design.md「設計上の判断 2」の通り、絞り込みには2種類ある。
        - 探す軸（area_id・category_id・scene）：クライアントが明示的に送る
        - 自分たち軸（stage・budget_range・with_child）：personalize=true を送ると
          サーバが会員の情報から補完する。明示パラメータが優先される
      tags: [spots]
      parameters:
        - name: area_id
          in: query
          description: 探す軸。エリアで絞り込む
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          description: 探す軸。カテゴリで絞り込む
          schema:
            type: string
            format: uuid
        - name: scene
          in: query
          description: |
            探す軸。利用シーンで絞り込む。
            ⚠️未実装：sceneはreviewsテーブルの属性でありスポット自体は持たないため、
            reviewsとのjoinが必要。reviews導入後の別PRで対応する（現時点では無視される）
          schema:
            type: string
        - name: personalize
          in: query
          description: |
            自分たち軸（ステージ・予算帯・子連れ訪問）をサーバ側で補完するか。
            ⚠️未実装：会員の判定に認証が要るため、認証導入後の別PRで対応する
            （現時点では無視される）
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          description: 前回のレスポンスの next_cursor
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: スポット一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /spots/{id}:
    get:
      operationId: getSpot
      summary: スポットの詳細を見る
      description: |
        スポット1つの詳しい情報を返す。doc/api-design.md「設計上の判断 3」の通り、
        「保存済みかどうか」は常に本人の視点のみで判定する
        （パートナーがサプライズ保存していてもこのフラグは立たない）。
      tags: [spots]
      parameters:
        - $ref: "#/components/parameters/SpotId"
      responses:
        "200":
          description: スポット詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /areas:
    get:
      operationId: listAreas
      summary: エリア一覧を見る
      description: |
        絞り込み（spots.area_id）に使うエリアのマスタを返す。doc/er-and-db-design.md の通り
        parent_id による親子構造（例：「渋谷エリア」の子に「代官山」「恵比寿」）を持つが、
        レスポンスはフラットな配列で返す。階層はクライアント側が parent_id を辿って組み立てる
        （件数が少ないマスタのため、ページングは無い）。
      tags: [areas]
      responses:
        "200":
          description: エリア一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaList"

  /categories:
    get:
      operationId: listCategories
      summary: カテゴリ一覧を見る
      description: |
        絞り込み（spots.category_id）に使うカテゴリのマスタを返す
        （件数が少ないマスタのため、ページングは無い）。
      tags: [categories]
      responses:
        "200":
          description: カテゴリ一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"

  /auth/sign_up:
    post:
      operationId: signUp
      summary: 新規登録する
      description: |
        会員を新しく作る（doc/use-cases.md「新規登録する」）。
        ⚠️未実装：登録と同時にログイン状態にする（トークンを返す）ことは未対応。
        トークン方式は決定済み（doc/requirements.md 決定事項ログ #30、/auth/sign_in と同じ AuthTokens）だが、
        このエンドポイントは現時点では作成した会員の情報だけを返す。

        利用規約への同意はクライアント側で必須にする（同意がないと登録ボタンを押せない）。

        メールアドレスが登録済みの場合は errors[].code=taken を返す。停止済み・退会済みの
        会員と同じメールアドレスでも同じ扱いにする（停止の事実を伝えない）。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: 登録できた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/sign_in:
    post:
      operationId: signIn
      summary: ログインする
      description: |
        メールアドレスとパスワードを確かめ、アクセストークンとリフレッシュトークンを返す
        （doc/use-cases.md「ログインする」）。ログインのたびに新しい認証セッションを作る
        （端末ごとに別のトークンになる）。

        失敗の理由は区別しない。メールアドレスが無い・パスワードが違う・退会済み・項目の欠けの
        どれでも、同じ 401（type=.../errors/invalid-credentials）を返す。メールアドレスが
        登録済みかどうかを外部から判定させないため（doc/api-design.md「設計上の判断 7」）。

        停止中の会員だけは、パスワードまで正しい場合に限り 403（type=.../errors/account-suspended）を返す
        （停止されていることを本人に伝える。本人以外には伝わらない）。

        ⚠️未実装：連続して失敗した場合の試行制限（doc/use-cases.md「ログインする」例外フロー、issue #111）。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: ログインできた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: トークンを更新する
      description: |
        リフレッシュトークンを渡し、新しいアクセストークンとリフレッシュトークンをもらう。
        渡したリフレッシュトークンはこの時点で使えなくなる（使うたびに入れ替わる）。

        リフレッシュトークンが無い・誤り・期限切れ・使用済み、または会員が停止・退会済みの場合は
        401（type=.../errors/unauthenticated）を返す。この場合はログインし直す。

        使用済み（入れ替え済み）のリフレッシュトークンが再び使われた場合は、盗まれたとみなして
        そのログイン（認証セッション）ごと失効させる。入れ替え後のトークンも使えなくなる。
        クライアントは同じリフレッシュトークンで更新を並行して送らないこと。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 更新できた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/sign_out:
    delete:
      operationId: signOut
      summary: ログアウトする
      description: |
        いまのアクセストークンが属する認証セッションを消す（doc/use-cases.md「ログアウトする」）。
        そのセッションのアクセストークン・リフレッシュトークンは2本とも使えなくなる。
        他の端末のログインには影響しない。
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: ログアウトできた
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        /auth/sign_in・/auth/refresh で受け取った access_token（有効期限15分）。
        中身は不透明な文字列として扱う（クライアントで解釈しない）。

  parameters:
    SpotId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Spot:
      type: object
      required: [id, name, area_id, category_id, average_rating, reviews_count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        area_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        average_rating:
          type: number
          format: float
          nullable: true
          description: |
            「1組のカップル/会員につき、1スポットあたり最新1件」のみを集計した平均
            （doc/domain-model.md）。レビューが無ければ null
        reviews_count:
          type: integer
          description: 平均評価に数えられているレビューの件数（★の横に添える件数表示に使う）

    SpotDetail:
      allOf:
        - $ref: "#/components/schemas/Spot"
        - type: object
          required: [saved, address]
          properties:
            saved:
              type: boolean
              description: |
                本人が保存済みかどうか（本人視点のみ。パートナーのサプライズは含まない）。
                ⚠️未実装：認証導入前は本人を判定できないため、常に false を返す
                （認証導入後の別PRで対応する）
            address:
              type: string
              description: |
                スポットの住所。「行くかどうかを判断したい」（doc/wireframes.md②）ために
                詳細画面のみで返す（一覧では返さない）

    Area:
      type: object
      required: [id, name, parent_id, position]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: 親エリアのid。最上位エリアは null
        position:
          type: integer
          description: 表示順

    AreaList:
      type: object
      required: [areas]
      properties:
        areas:
          type: array
          items:
            $ref: "#/components/schemas/Area"

    Category:
      type: object
      required: [id, name, position]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          description: 表示順

    CategoryList:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    SpotList:
      type: object
      required: [spots, next_cursor]
      properties:
        spots:
          type: array
          items:
            $ref: "#/components/schemas/Spot"
        next_cursor:
          type: string
          nullable: true
          description: 次ページが無ければ null

    SignUpRequest:
      type: object
      required: [email, password, nickname]
      properties:
        email:
          type: string
          format: email
          description: 前後の空白を除き、小文字にそろえて保存する（大文字小文字違いの重複登録を防ぐ）
        password:
          type: string
          format: password
          minLength: 8
          description: |
            8文字以上、UTF-8で72バイト以下（72バイトはbcryptの上限）。
            OpenAPIのmaxLengthは文字数で数えるためバイト数の上限を表せず、ここでは指定しない
            （超えた場合は errors[].code=too_long を返す）
        nickname:
          type: string
          minLength: 1
          maxLength: 50

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: 大文字小文字・前後の空白の違いは無視して照合する
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthTokens:
      type: object
      description: |
        ログイン・トークン更新の結果。refresh_token はこのレスポンスでしか受け取れない
        （サーバはダイジェストしか保持しない）。
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: 会員限定の窓口に Authorization ヘッダで付ける
        refresh_token:
          type: string
          description: /auth/refresh に渡す。有効期限30日。使うたびに入れ替わる
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: access_token の有効期間（秒）
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      description: |
        会員の情報。パスワード（password_digest）・状態（status）は返さない。
      required: [id, email, nickname, age_band, area_id, has_children, relationship_stage]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        age_band:
          type: string
          nullable: true
          enum: [late_teens, early_20s, late_20s, early_30s, late_30s, forties_and_over, null]
          description: |
            年代。10代後半／20代前半／20代後半／30代前半／30代後半／40代以上。未設定は null
        area_id:
          type: string
          format: uuid
          nullable: true
          description: 居住エリア。未設定は null
        has_children:
          type: boolean
          description: 子どもの有無（検索の初期値補完に使う）
        relationship_stage:
          type: string
          nullable: true
          enum: [early_dating, mid_dating, engaged, newlywed, married, null]
          description: |
            関係ステージ。交際初期／交際中期／婚約中／新婚／夫婦（doc/ubiquitous-language.md）。
            未設定は null

    Problem:
      type: object
      description: RFC 9457 (Problem Details) 形式。doc/api-design.md「設計上の判断 4」参照
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        request_id:
          type: string

    ValidationProblem:
      description: |
        入力内容の誤り。RFC 9457 の拡張メンバーとして、項目ごとの誤りを errors に入れる。
        表示する文言はクライアントが field・code から組み立てる（APIは文言を返さない）。
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                    description: 誤りのある項目名（例：email）
                  code:
                    type: string
                    description: 誤りの種類（blank / taken / invalid / too_short / too_long）

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: 入力内容に誤りがある
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    Unauthorized:
      description: |
        認証できない。ログイン失敗（invalid-credentials）、またはトークンが無い・誤り・期限切れ・
        失効済み（unauthenticated）。WWW-Authenticate: Bearer を付ける
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: 認証はできたが、許可されていない（停止中の会員のログイン：account-suspended）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 対象が存在しない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
