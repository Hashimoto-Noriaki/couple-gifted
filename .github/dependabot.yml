# Dependabot 設定（#70）
# ドキュメント: https://docs.github.com/ja/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# - 脆弱性の修正PR（security updates）はリポジトリ設定で有効化しており、脆弱性が出た時点で随時作られる
# - PRが来すぎないよう、週1回・ecosystemごとに次の最大3PRにまとめる
#   - <ecosystem>          : minor/patch の通常更新
#   - <ecosystem>-major    : major の通常更新（破壊的変更を含むので minor/patch とは分ける）
#   - <ecosystem>-security : 脆弱性の修正PR（applies-to: security-updates。指定しないと1パッケージ1PRで作られる）
# - コミット・PRタイトルは .claude/rules/git.md の規則に揃えて `chore:` にする
version: 2
updates:
  # backend の gem（Brakeman を含む。bin/brakeman が --ensure-latest 付きのため、新版が出ると CI が落ちる）
  - package-ecosystem: "bundler"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"
    groups:
      bundler:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bundler-major:
        patterns: ["*"]
        update-types: ["major"]
      bundler-security:
        applies-to: security-updates
        patterns: ["*"]

  # frontend のパッケージ（pnpm-lock.yaml も npm ecosystem で扱われる）
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # .github/workflows/ の actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-major:
        patterns: ["*"]
        update-types: ["major"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
