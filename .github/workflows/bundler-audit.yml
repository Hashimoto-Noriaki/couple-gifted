name: Bundler Audit

# gemの既知脆弱性チェック。脆弱性DB（ruby-advisory-db）の更新でコードと無関係に落ちるため、
# 通常のCI（ci.yml）から分離し、以下のタイミングでだけ実行する。
# 普段の検知・修正PRの作成はDependabot（alerts・security updates）に任せる。
on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 9:00 JST
  pull_request:
    paths:
      - "backend/Gemfile"
      - "backend/Gemfile.lock"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  bundler_audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
